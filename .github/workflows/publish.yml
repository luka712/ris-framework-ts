# The release version comes from CHANGELOG.md: the topmost "## [X.Y.Z]" heading not yet on npm
# (.github/scripts/release-version.sh). The version in the repository's package.json does not matter for
# publishing; CI sets it with `npm version` before publishing.
# development: publish X.Y.Z-dev.N on the npm "next" dist-tag, N being the next free number for X.Y.Z on npm.
#   Nothing is committed back.
# main: when X.Y.Z is unpublished, fill in every {{YYYY-MM-DD}} heading with today's UTC date, set package.json
#   to X.Y.Z, build, test, publish on "latest", and create tag/release vX.Y.Z. The date and version are committed
#   back as github-actions[bot] with [skip ci] when branch protection allows it. Older unpublished headings below
#   X.Y.Z get the same date but are not published separately. If every heading is on npm, nothing is published.

name: Publish

on:
  push:
    branches:
      - main
      - development

jobs:
  next:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish prerelease to next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(.github/scripts/release-version.sh pick)
          if [ -z "$BASE" ]; then
            echo "Every CHANGELOG version is already on npm. Add a new heading to publish a preview."
            exit 0
          fi
          PUBLISH_VERSION=$(.github/scripts/release-version.sh dev "$BASE")
          npm version "${PUBLISH_VERSION}" --no-git-tag-version --allow-same-version
          npm publish --provenance --tag next
          echo "Published ${PUBLISH_VERSION} on dist-tag next. Nothing was committed."

  latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Pick release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(.github/scripts/release-version.sh pick)
          if [ -z "$VERSION" ]; then
            echo "Every CHANGELOG version is already on npm. Skipping publish."
          else
            echo "Releasing ${VERSION}."
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.version.outputs.version != ''
        run: npm ci

      - name: Set version and CHANGELOG dates
        if: steps.version.outputs.version != ''
        run: |
          set -euo pipefail
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          .github/scripts/release-version.sh date
          grep -E '^## \[' CHANGELOG.md | head -n 3

      - name: Build
        if: steps.version.outputs.version != ''
        run: npm run build

      - name: Test
        if: steps.version.outputs.version != ''
        run: npm test

      - name: Publish release to latest
        if: steps.version.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm publish --provenance --tag latest
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release ${VERSION}: set version and CHANGELOG date [skip ci]"
            # Branch protection may reject this push; the published package already carries the date and version.
            git push origin "HEAD:${GITHUB_REF_NAME}" \
              || echo "::warning::Could not push the release commit to ${GITHUB_REF_NAME}."
          fi
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" \
            --generate-notes
          echo "Published ${VERSION} on dist-tag latest and created v${VERSION}."
