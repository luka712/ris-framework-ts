# development: publish <package.json version>-dev.<run> on the npm "next" dist-tag.
# main: publish <package.json version> on "latest" when that version is not already
# on npm, then create git tag v<version> and a GitHub release.
# Neither job commits the version change back to the repository.
# main: CHANGELOG headings dated {{YYYY-MM-DD}} get today's UTC date before publishing; the change is
# committed back to main as github-actions[bot] with [skip ci] when branch protection allows the push.

name: Publish

on:
  push:
    branches:
      - main
      - development

jobs:
  next:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish prerelease to next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*)
              echo "package.json version must be a release version with no prerelease suffix (got ${VERSION})."
              exit 1
              ;;
          esac
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
            PUBLISH_VERSION="${VERSION}-dev.${GITHUB_RUN_NUMBER}"
          else
            PUBLISH_VERSION="${VERSION}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          npm version "${PUBLISH_VERSION}" --no-git-tag-version
          npm publish --provenance --tag next
          echo "Published ${PUBLISH_VERSION} on dist-tag next. The version bump was not committed."

  latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Fill in CHANGELOG release dates
        run: |
          set -euo pipefail
          PATTERN='^(## \[[^]]+\] - )\{\{YYYY-MM-DD\}\}$'
          if ! grep -Eq "$PATTERN" CHANGELOG.md; then
            echo "No undated CHANGELOG headings. Nothing to do."
            exit 0
          fi
          DATE=$(date -u +%F)
          sed -E -i "s/${PATTERN}/\1${DATE}/" CHANGELOG.md
          grep -E '^## \[' CHANGELOG.md | head -n 3
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set CHANGELOG release date ${DATE} [skip ci]"
          # Branch protection may reject this push; the published package still carries the date.
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Pushed the dated CHANGELOG to ${GITHUB_REF_NAME}."
          else
            echo "::warning::Could not push the dated CHANGELOG to ${GITHUB_REF_NAME}. The npm package still includes the date."
          fi

      - name: Publish release to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*)
              echo "package.json version must be a release version with no prerelease suffix (got ${VERSION})."
              exit 1
              ;;
          esac
          PUBLISHED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "${NAME}@${VERSION} is already on npm. Skipping publish, tag, and GitHub release."
            exit 0
          fi
          npm publish --provenance --tag latest
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" \
            --generate-notes
          echo "Published ${NAME}@${VERSION} on dist-tag latest and created v${VERSION}."
